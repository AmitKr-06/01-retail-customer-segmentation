name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run training pipeline (generates model artifacts)
        run: |
          python -m src.pipeline.training_pipeline

      - name: Run tests
        run: |
          pytest tests/ -v

      - name: Lint check (optional)
        run: |
          pip install flake8
          flake8 src/ api/ --max-line-length=120 --ignore=E501,W503